[project]
name = "campus-mcp"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Taz", email = "christiantazma77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.6",
    "httpx>=0.29.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
campus-mcp-server = "campus_mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
